<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCM Global Time</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:12px 16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;
    background:#fff;
    color:#202124;
  }
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .title{font-size:14px;font-weight:700;letter-spacing:.2px}
  .hint{font-size:11px;color:#8a8f98}
  .grid{
    display:grid;
    grid-template-columns:repeat(6,minmax(120px,1fr));
    border:1px solid #e5e7eb;
    border-radius:8px;
    overflow:hidden;
  }
  .card{
    min-width:0;
    padding:11px 12px 10px;
    border-right:1px solid #e5e7eb;
    background:#fff;
  }
  .card:last-child{border-right:0}
  .top{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .flag{font-size:17px}
  .site{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:23px;font-weight:650;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
  .bottom{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;color:#777}
  .dot{width:7px;height:7px;border-radius:50%;background:#b9bec6;flex:none}
  .open .dot{background:#25a55f}
  .closed .dot{background:#d14b4b}
  @media(max-width:900px){
    .grid{grid-template-columns:repeat(3,1fr)}
    .card{border-bottom:1px solid #e5e7eb}
    .card:nth-child(3){border-right:0}
    .card:nth-child(n+4){border-bottom:0}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title">🌐 GLOBAL SCM TIME</div>
    <div class="hint">Business hours 09:00–18:00</div>
  </div>
  <div class="grid" id="grid"></div>

<script>
const sites = [
  {flag:"🇰🇷", site:"HQ", detail:"Korea", tz:"Asia/Seoul"},
  {flag:"🇨🇳", site:"KTC / GZ", detail:"China", tz:"Asia/Shanghai"},
  {flag:"🇮🇳", site:"SIEL", detail:"India", tz:"Asia/Kolkata"},
  {flag:"🇪🇬", site:"SEEG", detail:"Egypt", tz:"Africa/Cairo"},
  {flag:"🇲🇽", site:"SAMEX · ESE", detail:"Ensenada", tz:"America/Tijuana"},
  {flag:"🇧🇷", site:"SEDA · MAO", detail:"Manaus", tz:"America/Manaus"}
];

function parts(now, tz){
  const fmt = new Intl.DateTimeFormat("en-GB", {
    timeZone:tz, year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hourCycle:"h23", weekday:"short"
  });
  const p = Object.fromEntries(fmt.formatToParts(now).map(x=>[x.type,x.value]));
  return p;
}

function render(){
  const now = new Date();
  const grid = document.getElementById("grid");
  grid.innerHTML = sites.map(s=>{
    const p = parts(now,s.tz);
    const hour = Number(p.hour);
    const isOpen = hour >= 9 && hour < 18;
    return `<div class="card ${isOpen?"open":"closed"}">
      <div class="top"><span class="flag">${s.flag}</span><span class="site">${s.site}</span></div>
      <div class="time">${p.hour}:${p.minute}</div>
      <div class="bottom">
        <span class="dot"></span>
        <span>${isOpen?"Business hours":"Outside hours"} · ${p.weekday} ${p.day}/${p.month}</span>
      </div>
    </div>`;
  }).join("");
}
render();
setInterval(render, 1000);
</script>
</body>
</html>
